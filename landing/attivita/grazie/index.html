<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Richiesta ricevuta — Bellelli Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #fcf7fa; --ink: #231c29; --ink-soft: #5b5360; --accent: #d6156b; color-scheme: light; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: "Inter", system-ui, sans-serif; line-height: 1.6; padding: 24px; }
main { max-width: 520px; }
h1 { font-family: "Poppins", system-ui, sans-serif; font-size: 36px; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 14px; }
p { color: var(--ink-soft); margin: 0 0 22px; }
a { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; padding: 13px 22px; border-radius: 999px; }
</style>
</head>
<body>
<main>
  <h1>Grazie, ho ricevuto la tua richiesta.</h1>
  <p>Entro 24 ore lavorative guardo la scheda Google della tua attività e ti ricontatto con quello che migliorerei. Nel frattempo puoi dare un'occhiata al sito di esempio.</p>
  <a href="/esempi/caffe-dorico/">Guarda il sito di esempio</a>
</main>
</body>
</html>
