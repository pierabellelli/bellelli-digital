<!doctype html>
<html lang="it">
  <head><meta charset="utf-8" /><title>Bellelli Digital — contact form</title></head>
  <body>
    <!-- Static blueprint: Netlify scans this HTML at deploy time for React forms. -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="nome" />
      <input type="email" name="email" />
      <textarea name="messaggio"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
